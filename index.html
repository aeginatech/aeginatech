<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegina Tech | Soluções Tecnológicas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 3rem;
            color: #00cae3;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.2rem;
            color: #a0aec0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #00cae3, #0072ff);
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 202, 227, 0.4);
        }
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aegina Tech</h1>
        <p>Inovação, segurança e inteligência para transformar o seu negócio. Estamos preparando algo incrível para você.</p>
        <a href="#" class="btn">Em Breve</a>
    </div>

    <footer>
        &copy; 2026 Aegina Tech. Todos os direitos reservados.
    </footer>

</body>
</html>
